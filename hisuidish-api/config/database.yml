default: &default
  adapter: postgresql
  encoding: unicode
  # DATABASE_URL を優先しつつ、未設定時は個別値でフォールバック
  url: <%= ENV["DATABASE_URL"] %>
  host: <%= ENV.fetch("DB_HOST", "db") %>
  username: <%= ENV.fetch("DB_USER", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "postgres") %>
  database: <%= ENV.fetch("DB_NAME", "hisuidish_development") %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 10) %>

development:
  <<: *default
test:
  <<: *default
