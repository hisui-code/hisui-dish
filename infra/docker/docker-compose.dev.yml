name: hisuidish-dev
services:
  db:
    image: postgres:16
    command: ["postgres", "-c", "timezone=UTC"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hisuidish_development
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api-laravel:
    build:
      context: ../..
      dockerfile: infra/docker/laravel.Dockerfile
      args:
        PHP_VERSION: 8.5-rc
    depends_on:
      - db
    environment:
      APP_ENV: ${LARAVEL_APP_ENV:-local}
      APP_DEBUG: ${LARAVEL_APP_DEBUG:-true}
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: hisuidish_development
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      TZ: UTC
    volumes:
      - ../../backend:/app
      - composer_cache:/composer
    ports:
      - "8000:8000"
    env_file:
      - ../../.env
  web:
    build:
      context: ../../frontend
      dockerfile: ../infra/docker/web.Dockerfile
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "1"
      WATCHPACK_POLLING: "true"
      NODE_ENV: development
    volumes:
      - ../../frontend:/app:cached
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      - api-laravel
    env_file:
      - ../../.env

  device:
    build:
      context: ../..
      dockerfile: infra/docker/device.Dockerfile
    working_dir: /app
    volumes:
      - ../../device:/app
    env_file:
      - ../../.env
    depends_on:
      - api-laravel

volumes:
  composer_cache:
  pgdata:
