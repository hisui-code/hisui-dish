name: hisuidish-dev
services:
  db:
    image: postgres:16
    command: ["postgres", "-c", "timezone=UTC"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hisuidish_development
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      args:
        RUBY_VERSION: 3.4.5
    depends_on:
      - db
    environment:
      RAILS_ENV: development
      TZ: Asia/Tokyo
      CORS_ORIGINS: http://localhost:5173,http://localhost:3001
      DATABASE_URL: postgres://postgres:postgres@db:5432/hisuidish_rails_development
    volumes:
      - ../../backend-archive:/app # ← ルートの hisuidish-api を /app にマウント
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:3000"
    env_file:
      - ../../.env

  api-laravel:
    build:
      context: ../..
      dockerfile: infra/docker/laravel.Dockerfile
      args:
        PHP_VERSION: 8.5-rc
    depends_on:
      - db
    environment:
      APP_ENV: ${LARAVEL_APP_ENV:-local}
      APP_DEBUG: ${LARAVEL_APP_DEBUG:-true}
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: hisuidish_development
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      TZ: UTC
    volumes:
      - ../../backend:/app
      - composer_cache:/composer
    ports:
      - "8000:8000"
    env_file:
      - ../../.env
  web:
    build:
      context: ../../frontend
      dockerfile: ../infra/docker/web.Dockerfile
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "1"
      WATCHPACK_POLLING: "true"
      NODE_ENV: development
    volumes:
      - ../../frontend:/app:cached
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      - api
    env_file:
      - ../../.env

volumes:
  bundle_cache:
  composer_cache:
  pgdata:
