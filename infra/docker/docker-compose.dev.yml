name: hisuidish-dev
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hisuidish_development
      TZ: Asia/Tokyo
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      args:
        RUBY_VERSION: 3.4.5
    depends_on:
      - db
    environment:
      RAILS_ENV: development
      TZ: Asia/Tokyo
      CORS_ORIGINS: http://localhost:5173,http://localhost:3001
      DATABASE_URL: postgres://postgres:postgres@db:5432/hisuidish_development
    volumes:
      - ../../api:/app # ← ルートの hisuidish-api を /app にマウント
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:3000"
    env_file:
      - ../../.env
  web:
    build:
      context: ../../web
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "1"
      WATCHPACK_POLLING: "true"
      NODE_ENV: development
    volumes:
      - ../../web:/app:cached
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      - api
    env_file:
      - ../../.env

volumes:
  bundle_cache:
  pgdata:
